# Reference_2030: 2030 system, 2030 DC demand, dispatch only. Includes Form 860 planned additions and retirements.
# Fixed capacity at current operating fleet — production cost run.
run:
  name: "CA_Ref2030_AB32RPS"
  disable_progressbar: false
  shared_resources: false
  shared_cutouts: true
  validation: false

data_centers:
  enable: true
  demand_file: "data/data_centers/ca_county_demand_MWh.csv"  # uses 2030 column

scenario:
  interconnect: [western]
  clusters: [58]
  simpl: [150]
  opts: [RPS-REM-TCT-3h]
  ll: [v1.0]
  sector: ""
  planning_horizons: [2030]
foresight: 'myopic'

model_topology:
  transmission_network: 'reeds'
  topological_boundaries: 'county'
  interface_transmission_limits: false
  include:
    reeds_state: [CA]
  aggregate:

enable:
  build_cutout: false

renewable_weather_years: [2019]

snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: "left"

electricity:
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, geothermal, biomass, waste]
  renewable_carriers: [onwind, offwind_floating, solar, hydro]
  retirement: technical
  respect_planned_retirements: true
  SAFE_reservemargin: 0.14
  regional_Co2_limits: 'config/policy_constraints/regional_Co2_limits.csv'
  technology_capacity_targets: 'config/policy_constraints/technology_capacity_targets.csv'
  portfolio_standards: 'config/policy_constraints/portfolio_standards.csv'
  SAFE_regional_reservemargins: 'config/policy_constraints/SAFE_regional_prm.csv'
  transmission_interface_limits: 'config/policy_constraints/transmission_interface_limits.csv'

  operational_reserve:
    activate: false
    epsilon_load: 0.02
    epsilon_vres: 0.02
    contingency: 4000

  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

  demand:
    profile: efs
    scenario:
      efs_case: reference
      efs_speed: moderate
      aeo: reference

  demand_response:
    shift: 0
    marginal_cost: 999999

conventional:
  unit_commitment: false
  must_run: false
  dynamic_fuel_price:
    enable: false
    pudl: true
    wholesale: true

lines:
  s_max_pu: 0.7
  s_nom_max: .inf
  max_extension: 20000
  length_factor: 1.25

links:
  p_max_pu: 1.0
  p_nom_max: .inf
  max_extension: 20000

co2:
  storage: false
  network:
    enable: false
    capital_cost: 2736000
    marginal_cost: 4
    lifetime: 40
    discount_rate: 0.07

dac:
  enable: false
  granularity: "node"
  capital_cost: 6000000
  electricity_input: 2.5
  lifetime: 20
  discount_rate: 0.07

costs:
  atb:
    model_case: "Market"
    scenario: "Moderate"
  aeo:
    scenario: "reference"
  social_discount_rate: 0.02
  ng_fuel_year: 2019
  emission_prices:
    enable: false
    co2: 0.
    co2_monthly_prices: false
  ptc_modifier:
    onwind: 27.50
    biomass: 27.50
  itc_modifier:
    solar: 0.3
    offwind: 0.3
    offwind_floating: 0.3
    EGS: 0.3
    geothermal: 0.3
    SMR: 0.3
    nuclear: 0.3
    hydro: 0.3
    2hr_battery_storage: 0.3
    4hr_battery_storage: 0.3
    6hr_battery_storage: 0.3
    8hr_battery_storage: 0.3
    10hr_battery_storage: 0.3
    8hr_PHS: 0.3
    10hr_PHS: 0.3
    12hr_PHS: 0.3
  min_year:
    hydrogen_ct: 2040
  max_growth:

clustering:
  simplify_network:
    weighting_strategy: demand-capacity
    to_substations: false
    algorithm: kmeans
    feature: solar+onwind-time
  cluster_network:
    weighting_strategy: demand-capacity
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    consider_efficiency_classes: false
  aggregation_strategies:
    generators:
      build_year: 'capacity_weighted_average'
      lifetime: 'capacity_weighted_average'
      start_up_cost: 'capacity_weighted_average'
      min_up_time: 'capacity_weighted_average'
      min_down_time: 'capacity_weighted_average'
      ramp_limit_up: max
      ramp_limit_down: max
      committable: any
      vom_cost: mean
      fuel_cost: mean
      heat_rate: mean
  temporal:
    resolution_elec: false
    resolution_sector: false

focus_weights:

solving:
  options:
    load_shedding: true
    clip_p_max_pu: 1.e-2
    noisy_costs: true
    skip_iterations: true
    rolling_horizon: false
    seed: 123
    track_iterations: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 2
    linearized_unit_commitment: true
    horizon: 8760
    assign_all_duals: true

  solver:
    name: gurobi
    options: gurobi-default

  solver_options:
    highs-default:
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 16
      method: 2
      crossover: 0
      BarHomogeneous: 1
      BarConvTol: 1.e-4
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-3
      ScaleFlag: 1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200


walltime:
  build_renewable_profiles: '04:00:00'
  build_fuel_prices: '00:20:00'
  add_demand: '02:00:00'
  add_electricity: '04:00:00'
  simplify_network: '05:00:00'
  cluster_network: '04:00:00'
  solve_network: '24:00:00'

custom_files:
  activate: false
  files_path: ''
  network_name: ''
